[package]
name = "qmcp"
description = "MCP server for controlling a running QueryMT ACP WebSocket server."
authors = ["Ivan Zatevakhin <ivan@query.mt>"]
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"

[[bin]]
name = "qmcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
qmacp = { git = "https://github.com/querymt/qmacp", tag = "v0.1.1" }
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
