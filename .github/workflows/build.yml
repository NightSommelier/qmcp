name: Build Binaries (Reusable)

on:
  workflow_call:
    inputs:
      version_name:
        description: Version identifier used in archive names
        required: true
        type: string
      is_nightly:
        description: Whether this is a nightly build
        type: boolean
        default: false
      revision:
        description: Exact source revision to build (defaults to the caller's commit)
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/nightly.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'build.rs'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_flags: '-C target-feature=+crt-static'
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_flags: '-C target-feature=+crt-static'
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            toolchain_target: x86_64-unknown-freebsd@14
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Verify release version
        if: github.ref_type == 'tag' && !inputs.is_nightly
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.toolchain_target || matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rust_flags || '' }}
        run: cargo build --locked --release --bin qmcp --target ${{ matrix.target }}

      - name: Package archive (Linux, macOS and FreeBSD)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          PKG="qmcp-${VERSION_NAME//\//-}-${TARGET}"
          STAGING="dist/${PKG}"
          mkdir -p "$STAGING"
          cp "target/${TARGET}/release/qmcp" README.md LICENSE "$STAGING/"
          cp -R docs "$STAGING/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "$PKG"
          echo "ASSET_PATH=dist/${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $PKG = "qmcp-$($env:VERSION_NAME.Replace('/', '-'))-$($env:TARGET)"
          $STAGING = Join-Path 'dist' $PKG
          New-Item -ItemType Directory -Force -Path $STAGING | Out-Null
          Copy-Item "target/$($env:TARGET)/release/qmcp.exe" -Destination $STAGING
          Copy-Item README.md, LICENSE -Destination $STAGING
          Copy-Item docs -Destination $STAGING -Recurse
          $ZIP_PATH = "dist/${PKG}.zip"
          Compress-Archive -Path (Join-Path $STAGING '*') -DestinationPath $ZIP_PATH -Force
          "ASSET_PATH=${ZIP_PATH}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qmcp-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
