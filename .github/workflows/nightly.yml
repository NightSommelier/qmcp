name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication so runs cannot race while replacing the nightly release.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check for changes since last nightly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      revision: ${{ steps.check.outputs.revision }}
      version_name: ${{ steps.check.outputs.version_name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Check for changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_NIGHTLY_SHA=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$LAST_NIGHTLY_SHA" != "$CURRENT_SHA" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_name=nightly-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build Nightly Binaries
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build.yml
    with:
      version_name: ${{ needs.check-changes.outputs.version_name }}
      is_nightly: true
      revision: ${{ needs.check-changes.outputs.revision }}

  release:
    name: Create Nightly GitHub Release
    needs: [check-changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/
          pattern: 'qmcp-*'
          merge-multiple: true

      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.check-changes.outputs.revision }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly Build" \
            --notes "**This is a pre-release build from the main branch.**

          It is not intended for production use.

          Commit: \`$REVISION\`" \
            --prerelease \
            --target "$REVISION" \
            artifacts/*
